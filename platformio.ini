; Secador de filamento V0.1
; Modulo objetivo: ESP-12F (ESP8266EX, flash 4 MB, modo DIO).
; PlatformIO no tiene un id "esp12f"; el manifiesto esp12e describe el mismo
; modulo (ESP8266EX + 4 MB) y es el correcto para el ESP-12F.
;
; El entorno por defecto programa por UART (esptool).
; Las actualizaciones posteriores usan el entorno esp12f_ota (espota).
; No pongas aqui la contrasena real si el archivo se versiona.

[platformio]
default_envs = esp12f

[env:esp12f]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool
monitor_filters = esp8266_exception_decoder

; 4 MB (FS:2 MB, OTA:~1019 KB). El sketch maximo es 1044464 bytes.
; eagle.flash.4m.ld / un maximum_size de 4 MB NO dejan un slot OTA usable.
board_build.ldscript = eagle.flash.4m2m.ld
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_upload.maximum_size = 1044464

build_flags =
    -Wall
    -Wextra
    -Isrc

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4

[env:esp12f_ota]
extends = env:esp12f
upload_protocol = espota
; Hostname anunciado por mDNS, o la IP del equipo.
; Ejemplo: FILAMENT-DRYER-A1B2C3.local
upload_port = FILAMENT-DRYER-XXXXXX.local
upload_flags =
    --port=8266
    --auth=CHANGE_ME
